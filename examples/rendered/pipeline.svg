<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Adaptive Field Monitoring</title>
<desc id="desc">A five-stage workflow turns distributed observations into reviewed alerts.</desc>
<defs><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315b9b"/></marker><marker id="arrow-sequence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g id="header" font-family="Arial, Helvetica, sans-serif">
<text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#26384d">Adaptive Field Monitoring</text>
<text x="600" y="68" text-anchor="middle" font-size="13" fill="#59636e">A five-stage workflow turns distributed observations into reviewed alerts.</text>
</g>
<g id="archetype" data-archetype="pipeline"/>
<g id="edges" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path id="edge-0" data-from="sensors" data-to="clean" data-relation="data" data-review-status="confirmed" data-source="Synthetic example" d="M 280.0 315.0 L 288.5 315.0" stroke="#315b9b" stroke-width="2" opacity="1" marker-end="url(#arrow-data)"/>
<path id="edge-1" data-from="clean" data-to="model" data-relation="sequence" data-review-status="confirmed" data-source="Synthetic example" d="M 487.5 315.0 L 496.0 315.0" stroke="#444444" stroke-width="2" opacity="1" marker-end="url(#arrow-sequence)"/>
<path id="edge-2" data-from="model" data-to="review" data-relation="sequence" data-review-status="confirmed" data-source="Synthetic example" d="M 695.0 315.0 L 703.5 315.0" stroke="#444444" stroke-width="2" opacity="1" marker-end="url(#arrow-sequence)"/>
<path id="edge-3" data-from="review" data-to="action" data-relation="sequence" data-review-status="confirmed" data-source="Synthetic example" d="M 902.5 315.0 L 911.0 315.0" stroke="#444444" stroke-width="2" opacity="1" marker-end="url(#arrow-sequence)"/>
</g>
<g id="nodes" font-family="Arial, Helvetica, sans-serif">
<g id="node-sensors" data-role="input" data-review-status="confirmed" data-source="Synthetic example" opacity="1">
<rect x="90.0" y="261.0" width="190.0" height="108.0" rx="8" fill="#e8f1f8" stroke="#376a8e" stroke-width="2"/>
<text x="185.0" y="306.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Field observations</text>
<text x="185.0" y="325.0" text-anchor="middle" font-size="11" fill="#626d78">temperature, moisture</text>
<title>Source: Synthetic example</title>
</g>
<g id="node-clean" data-role="process" data-review-status="confirmed" data-source="Synthetic example" opacity="1">
<rect x="297.5" y="261.0" width="190.0" height="108.0" rx="8" fill="#edf1f7" stroke="#315b9b" stroke-width="2"/>
<text x="392.5" y="306.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Quality screening</text>
<text x="392.5" y="325.0" text-anchor="middle" font-size="11" fill="#626d78">flag missing values</text>
<title>Source: Synthetic example</title>
</g>
<g id="node-model" data-role="evidence" data-review-status="confirmed" data-source="Synthetic example" opacity="1">
<rect x="505.0" y="261.0" width="190.0" height="108.0" rx="8" fill="#e9f2df" stroke="#558d3b" stroke-width="2"/>
<text x="600.0" y="306.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Risk estimation</text>
<text x="600.0" y="325.0" text-anchor="middle" font-size="11" fill="#626d78">review threshold</text>
<title>Source: Synthetic example</title>
</g>
<g id="node-review" data-role="process" data-review-status="confirmed" data-source="Synthetic example" opacity="1">
<rect x="712.5" y="261.0" width="190.0" height="108.0" rx="8" fill="#edf1f7" stroke="#315b9b" stroke-width="2"/>
<text x="807.5" y="306.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Expert review</text>
<text x="807.5" y="325.0" text-anchor="middle" font-size="11" fill="#626d78">confirm alert</text>
<title>Source: Synthetic example</title>
</g>
<g id="node-action" data-role="output" data-review-status="confirmed" data-source="Synthetic example" opacity="1">
<rect x="920.0" y="261.0" width="190.0" height="108.0" rx="8" fill="#fff0df" stroke="#d56b00" stroke-width="2"/>
<text x="1015.0" y="306.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Field response</text>
<text x="1015.0" y="325.0" text-anchor="middle" font-size="11" fill="#626d78">document action</text>
<title>Source: Synthetic example</title>
</g>
</g>
<g id="relation-legend" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#59636e">
<path d="M 50.0 549.0 h 24" stroke="#315b9b" stroke-width="1.5" marker-end="url(#arrow-data)"/><text x="84.0" y="552.0">data</text>
<path d="M 325.0 549.0 h 24" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow-sequence)"/><text x="359.0" y="552.0">sequence</text>
</g>
</svg>