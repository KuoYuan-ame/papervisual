<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Iterative Sampling Plan</title>
<desc id="desc">A synthetic planning loop revises the next sampling round after review.</desc>
<defs><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315b9b"/></marker><marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#558d3b"/></marker><marker id="arrow-sequence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g id="header" font-family="Arial, Helvetica, sans-serif">
<text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#26384d">Iterative Sampling Plan</text>
<text x="600" y="68" text-anchor="middle" font-size="13" fill="#59636e">A synthetic planning loop revises the next sampling round after review.</text>
</g>
<g id="archetype" data-archetype="loop"/>
<g id="edges" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path id="edge-0" data-from="plan" data-to="collect" data-relation="sequence" data-review-status="confirmed" data-source="Synthetic design brief" d="M 695.0 241.9 L 864.4 337.2" stroke="#444444" stroke-width="2" opacity="1" marker-end="url(#arrow-sequence)"/>
<path id="edge-1" data-from="collect" data-to="evaluate" data-relation="data" data-review-status="confirmed" data-source="Synthetic design brief" d="M 872.2 448.4 L 702.8 543.7" stroke="#315b9b" stroke-width="2" opacity="1" marker-end="url(#arrow-data)"/>
<path id="edge-2" data-from="evaluate" data-to="revise" data-relation="sequence" data-review-status="confirmed" data-source="Synthetic design brief" d="M 505.0 548.1 L 335.6 452.8" stroke="#444444" stroke-width="2" opacity="1" marker-end="url(#arrow-sequence)"/>
<path id="edge-3" data-from="revise" data-to="plan" data-relation="feedback" data-review-status="confirmed" data-source="Synthetic design brief" d="M 327.8 341.6 L 497.2 246.3" stroke="#558d3b" stroke-width="2" opacity="1" stroke-dasharray="7 5" marker-end="url(#arrow-feedback)"/>
</g>
<g id="nodes" font-family="Arial, Helvetica, sans-serif">
<g id="node-plan" data-role="input" data-review-status="confirmed" data-source="Synthetic design brief" opacity="1">
<rect x="505.0" y="134.5" width="190.0" height="108.0" rx="8" fill="#e8f1f8" stroke="#376a8e" stroke-width="2"/>
<text x="600.0" y="188.5" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Plan sampling</text>
<title>Source: Synthetic design brief</title>
</g>
<g id="node-collect" data-role="process" data-review-status="confirmed" data-source="Synthetic design brief" opacity="1">
<rect x="872.2" y="341.0" width="190.0" height="108.0" rx="8" fill="#edf1f7" stroke="#315b9b" stroke-width="2"/>
<text x="967.2" y="395.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Collect samples</text>
<title>Source: Synthetic design brief</title>
</g>
<g id="node-evaluate" data-role="evidence" data-review-status="confirmed" data-source="Synthetic design brief" opacity="1">
<rect x="505.0" y="547.5" width="190.0" height="108.0" rx="8" fill="#e9f2df" stroke="#558d3b" stroke-width="2"/>
<text x="600.0" y="601.5" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Evaluate coverage</text>
<title>Source: Synthetic design brief</title>
</g>
<g id="node-revise" data-role="output" data-review-status="confirmed" data-source="Synthetic design brief" opacity="1">
<rect x="137.8" y="341.0" width="190.0" height="108.0" rx="8" fill="#fff0df" stroke="#d56b00" stroke-width="2"/>
<text x="232.8" y="395.0" text-anchor="middle" font-size="15" font-weight="700" fill="#26384d">Review and revise</text>
<title>Source: Synthetic design brief</title>
</g>
</g>
<g id="relation-legend" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#59636e">
<path d="M 50.0 709.0 h 24" stroke="#315b9b" stroke-width="1.5" marker-end="url(#arrow-data)"/><text x="84.0" y="712.0">data</text>
<path d="M 325.0 709.0 h 24" stroke="#558d3b" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow-feedback)"/><text x="359.0" y="712.0">feedback</text>
<path d="M 600.0 709.0 h 24" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow-sequence)"/><text x="634.0" y="712.0">sequence</text>
</g>
</svg>