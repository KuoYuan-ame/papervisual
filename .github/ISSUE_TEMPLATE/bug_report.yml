name: Bug report
description: Report a reproducible problem with validation, layout, rendering, or export.
body:
  - type: input
    id: version
    attributes:
      label: Version and Python version
      placeholder: "0.1.0 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove unpublished or sensitive manuscript content before sharing.
      render: json
    validations:
      required: true
