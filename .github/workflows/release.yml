name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build ".[audit]" jsonschema ruff
      - run: ruff check --select F,E9 src tests tools skills/papervisual/scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python tools/verify_examples.py
      - run: python tools/bundle_skill.py --check --zip dist/papervisual-skill.zip
      - run: python skills/papervisual/scripts/self_check.py --output-dir work/release-self-check --require-raster --release --rendered
      - run: papervisual validate examples/mechanism.json
      - run: papervisual render examples/mechanism.json --output mechanism-release.svg
      - run: papervisual qa examples/mechanism.json --svg mechanism-release.svg
      - run: python -m build
      - run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME} — Initial MVP" --notes-file docs/releases/v0.1.0.md --prerelease
