name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[audit]" jsonschema ruff
      - run: ruff check --select F,E9 src tests tools skills/papervisual/scripts
      - run: python tools/verify_examples.py
      - run: python tools/bundle_skill.py --check
      - run: python skills/papervisual/scripts/self_check.py --output-dir work/self-check --require-raster --release --rendered
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -S skills/papervisual/scripts/self_check.py --output-dir work/self-check-svg --release
      - run: python -m compileall -q src tests
      - run: python -c "import json; json.load(open('schemas/figure-ir.schema.json', encoding='utf-8'))"
      - run: papervisual validate examples/mechanism.json
      - run: papervisual render examples/mechanism.json --output mechanism-ci.svg
      - run: papervisual qa examples/mechanism.json --svg mechanism-ci.svg
